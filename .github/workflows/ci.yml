# §15: gates + build on every PR. Production deploy on merge is Cloudflare
# Pages' git integration — the single §4 deploy path; this job gates the merge.
#
# The job is named `ci` because ruleset-main.json requires the status-check
# context "ci" (§4). Rename one and you MUST rename both, or merges block.
# The Playwright harness runs here (§15): each site's built dist is served under
# its real production _headers CSP and exercised before any merge. Pages deploys
# from main on merge, so this job is the only gate — keep it that way.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:                                   # job name == the required status-check context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc     # never a hardcoded node-version: (§15)
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds all five sites (each site's build also generates its Pagefind index).
      - run: pnpm build

      - name: Install Chromium for the harness
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright harness (all five sites, real production CSP)
        run: pnpm test

      # §2 gate: built output must be free of runtime code generation.
      - name: No eval in built output
        run: |
          set -euo pipefail
          for d in sites/*/dist; do ./scripts/no-eval.sh "$d"; done

      # §1 gate: no mailto: in built output except security.txt.
      - name: No mailto in built output
        run: |
          set -euo pipefail
          hits="$(grep -rn 'mailto:' sites/*/dist | grep -v '/\.well-known/security\.txt:' || true)"
          if [ -n "$hits" ]; then echo "::error::mailto: link in built output (§1)"; echo "$hits"; exit 1; fi

      # Production tree only — a dev-tree advisory never reaches a user (§15).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
